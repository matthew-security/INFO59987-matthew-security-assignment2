services:
  books-api:
    build:
      context: ./services/books_api
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks:
      - backend
      - frontend

  staff-api:
    build:
      context: ./services/staff_api
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks:
      - backend
      - frontend

  readers-api:
    build:
      context: ./services/readers_api
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks:
      - backend
      - frontend

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    mem_limit: 1g
    networks:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      books-api:
        condition: service_healthy
      staff-api:
        condition: service_healthy
      readers-api:
        condition: service_healthy
    networks:
      - frontend

networks:
  frontend:
    name: app_frontend
  backend:
    name: app_backend

volumes:
  db-data:
    name: app_db_data
