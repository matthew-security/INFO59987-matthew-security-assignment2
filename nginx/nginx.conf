events {
    worker_connections 1024;
}

http {
    upstream books_api {
        server books-api:5000;
    }

    upstream staff_api {
        server staff-api:5000;
    }

    upstream readers_api {
        server readers-api:5000;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint (answered by Nginx itself)
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy';
        }

        # /api/books/... becomes /books/... at the Flask app
        location /api/books {
            proxy_pass http://books_api/books;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # /api/staff/... becomes /staff/...
        location /api/staff {
            proxy_pass http://staff_api/staff;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # /api/readers/... becomes /readers/...
        location /api/readers {
            proxy_pass http://readers_api/readers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
